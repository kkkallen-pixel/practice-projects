<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>轻食小馆 - 在线点餐演示</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div>
        <h1>轻食小馆</h1>
        <p class="slogan">点餐系统 HTML5 演示页</p>
      </div>
      <input id="searchBox" class="search-box" type="search" placeholder="搜索菜品，例如：三明治" />
    </div>
  </header>

  <main class="container">
    <nav class="category-bar" aria-label="菜品分类">
      <button class="category-btn active" data-category="全部">全部</button>
      <button class="category-btn" data-category="主食">主食</button>
      <button class="category-btn" data-category="小吃">小吃</button>
      <button class="category-btn" data-category="饮品">饮品</button>
      <button class="category-btn" data-category="甜点">甜点</button>
    </nav>

    <section class="layout">
      <div id="menuGrid" class="menu-grid" aria-live="polite"></div>

      <aside class="cart-panel">
        <h2>购物车 <span id="cartCount" class="cart-count">0</span></h2>
        <ul id="cartItems" class="cart-list"></ul>
        <div class="cart-total">合计：<strong id="totalPrice">¥0</strong></div>
        <div class="cart-actions">
          <button id="clearCart" class="btn ghost">清空</button>
          <button id="checkout" class="btn primary">提交订单</button>
        </div>
      </aside>
    </section>
  </main>

  <footer class="site-footer">HTML5 / CSS / JavaScript 个人练习项目</footer>

  <script src="js/app.js"></script>
</body>
</html>
